<li class="lnb-item{% if active == 'runs' %} active{% endif %}">
  <a href="/policy/runs" class="lnb-btn lnb-link"{% if active == 'runs' %} aria-current="page"{% endif %}>분석 회차</a>
</li>
{% if run is defined %}
{% for num, s in scenarios.items() %}
<li class="lnb-item{% if active == 's' ~ num %} active{% endif %}">
  <a href="/policy/runs/{{ run.run_id }}/scenarios/{{ num }}" class="lnb-btn lnb-link"{% if active == 's' ~ num %} aria-current="page"{% endif %}>{{ s.title }}</a>
</li>
{% endfor %}
{% endif %}
