{% macro count(value, min_cell) -%}
{% if value is none %}<span class="rv-masked" title="{{ min_cell }} 미만이라 가림">가림</span>{% else %}{{ value | num }}{% endif %}
{%- endmacro %}

{% macro analysis_status(status, label) -%}
{% set badge = {'running': 'outline-information', 'succeeded': 'outline-success', 'failed': 'outline-danger'} %}
<span class="krds-badge {{ badge.get(status, 'outline-gray') }}">{{ label }}</span>
{%- endmacro %}
